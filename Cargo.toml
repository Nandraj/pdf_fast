[package]
name = "pdf_fast"
version = "0.1.3"
edition = "2021"
description = "Fast, low-memory PDF page count and first-N-page extraction (Rust + PyO3)"
license = "MIT"

[lib]
name = "pdf_fast"
crate-type = ["cdylib"]

[dependencies]
memmap2 = "0.9"
pdf = { version = "0.10", default-features = false, features = ["sync"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
