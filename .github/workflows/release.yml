name: Build and release

# Runs ONLY when a version tag (v0.1.1, v1.0.0, ...) is pushed.
# workflow_dispatch is a manual "Run workflow" button for dry runs; it never
# fires on its own and never uploads to PyPI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: quick Linux build + smoke test. Everything else waits for this.
  # ---------------------------------------------------------------------------
  check-linux:
    name: Linux check (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          manylinux: auto
      - name: Smoke test the built wheel
        run: |
          python -m pip install --no-index --find-links dist pdf-fast
          python tests/smoke.py
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

  # ---------------------------------------------------------------------------
  # Stage 2: remaining platforms, only after the Linux check passed.
  # Rarely used targets (x86, armv7, s390x, ppc64le, windows x86/arm64) are
  # intentionally not built.
  # ---------------------------------------------------------------------------
  linux-aarch64:
    name: Linux aarch64
    needs: check-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-aarch64
          path: dist

  musllinux:
    name: musllinux ${{ matrix.target }}
    needs: check-linux
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    name: Windows x64
    needs: check-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    name: macOS ${{ matrix.target }}
    needs: check-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    needs: check-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # ---------------------------------------------------------------------------
  # Stage 3: publish, only when every build above succeeded AND this is a tag.
  # ---------------------------------------------------------------------------
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [check-linux, linux-aarch64, musllinux, windows, macos, sdist]
    permissions:
      id-token: write       # artifact attestation
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
