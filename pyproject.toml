[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pdf-fast"
version = "0.1.0"
description = "Fast, low-memory PDF page count and first-N-page extraction (Rust)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.maturin]
features = []
strip = true
